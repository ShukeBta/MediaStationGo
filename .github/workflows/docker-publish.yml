name: Publish immutable candidate image
run-name: candidate ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git commit, tag, or branch to build
        required: true
        default: main
        type: string
      version:
        description: Optional immutable version tag; defaults to sha-<full-sha>
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: mediastation-go-candidate-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve immutable metadata
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          version="${REQUESTED_VERSION:-sha-${revision}}"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved revision is not a full commit SHA: $revision" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker version tag: $version" >&2
            exit 1
          fi
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/mediastation-go" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=raw,value=sha-${{ steps.release.outputs.revision }}
            type=raw,value=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push linux/amd64 candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ steps.release.outputs.revision }}
          cache-from: type=gha,scope=mediastation-go-linux-amd64
          cache-to: type=gha,mode=max,scope=mediastation-go-linux-amd64

      - name: Record immutable image reference
        shell: bash
        run: |
          {
            echo "### Immutable candidate"
            echo
            echo '```text'
            echo "${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Revision: \`${{ steps.release.outputs.revision }}\`"
            echo "Version: \`${{ steps.release.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
