name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Install PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"

      - name: go build
        run: go build ./...

      - name: go test
        env:
          MEDIASTATION_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./...

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check & build
        run: npm run build

  smoke:
    name: Deployment smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate single-image compose
        run: docker compose -f docker-compose.simple.yml config --quiet
      - name: Validate tier 1 compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate tier 2 compose
        run: docker compose -f docker-compose.standard.yml config --quiet
      - name: Validate tier 3 compose
        run: docker compose -f docker-compose.search.yml config --quiet
